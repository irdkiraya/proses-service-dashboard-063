<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kelola Unit - Astra Daihatsu Citra Raya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #080c17; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen p-3 md:p-6 font-sans antialiased">
  <div class="max-w-5xl mx-auto space-y-4">

    <!-- Header Panel Admin -->
    <div class="bg-[#111726] border border-slate-800 p-4 rounded-2xl shadow-xl flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
        <div class="bg-white px-3 py-1.5 rounded-xl shadow flex items-center gap-2">
          <img src="./public/logo-astra.png" alt="Astra Daihatsu" class="h-6 sm:h-7 w-auto object-contain"
               onerror="this.style.display='none'; document.getElementById('fallbackLogoAdmin').classList.remove('hidden');">
          <div id="fallbackLogoAdmin" class="hidden bg-red-600 px-2 py-1 rounded text-white font-bold text-xs">DAIHATSU</div>
        </div>
        <div class="text-right sm:text-left">
          <h1 class="text-sm sm:text-base font-black tracking-wide text-white leading-tight">
            ASTRA DAIHATSU <span class="text-red-500">CITRA RAYA</span>
          </h1>
          <p class="text-slate-400 text-[11px]">Panel Kontrol & Kelola Unit</p>
        </div>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
        <a href="index.html" class="flex-1 sm:flex-none text-center bg-red-600 hover:bg-red-500 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-lg shadow-red-600/20 transition cursor-pointer">
          📺 Buka Monitor TV
        </a>
        <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs px-3 py-2 rounded-xl border border-slate-700 transition cursor-pointer">
          Keluar
        </button>
      </div>
    </div>

    <!-- Form Tambah Unit & Daftar Antrean -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      
      <!-- Form Input Unit Baru -->
      <div class="bg-[#111726] border border-slate-800 p-4 rounded-2xl shadow-xl space-y-3">
        <h2 class="text-sm font-extrabold text-white flex items-center gap-2 border-b border-slate-800 pb-2">
          <span class="text-red-500 text-base">＋</span> Tambah Unit Baru
        </h2>
        
        <form id="addForm" onsubmit="addVehicle(event)" class="space-y-2.5">
          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">NO. POLISI</label>
            <input type="text" id="no_polisi" required placeholder="Contoh: B 1234 XY" 
                   class="w-full bg-[#080c17] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-red-500 uppercase font-mono font-bold">
          </div>

          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">TIPE MOBIL</label>
            <select id="tipe_mobil" required class="w-full bg-[#080c17] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-red-500">
              <option value="">-- Pilih Tipe Mobil --</option>
              <option value="Rocky">Rocky</option>
              <option value="Ayla">Ayla</option>
              <option value="Grandmax Minibus">Grandmax Minibus</option>
              <option value="Grandmax Pick Up">Grandmax Pick Up</option>
              <option value="Xenia">Xenia</option>
              <option value="Sigra">Sigra</option>
              <option value="Terios">Terios</option>
              <option value="Luxio">Luxio</option>
              <option value="Sirion">Sirion</option>
            </select>
          </div>

          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">NAMA MEKANIK</label>
            <input type="text" id="mekanik" required placeholder="Nama Mekanik" 
                   class="w-full bg-[#080c17] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-red-500">
          </div>

          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">STALL BENGKEL</label>
            <select id="stall" required class="w-full bg-[#080c17] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-red-500">
              <option value="">-- Pilih Stall --</option>
              <option value="Stall 1">Stall 1</option>
              <option value="Stall 2">Stall 2</option>
              <option value="Stall 3">Stall 3</option>
              <option value="Stall 4">Stall 4</option>
              <option value="Stall Express">Stall Express</option>
            </select>
          </div>

          <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold text-xs py-2.5 rounded-xl shadow-lg shadow-red-600/25 transition cursor-pointer mt-2">
            Masuk Proses Service
          </button>
        </form>
      </div>

      <!-- Daftar Unit Aktif -->
      <div class="lg:col-span-2 bg-[#111726] border border-slate-800 p-4 rounded-2xl shadow-xl flex flex-col">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-3">
          <h2 class="text-sm font-extrabold text-white">Daftar Antrean Unit Aktif</h2>
          <span id="totalUnitBadge" class="bg-red-500/20 text-red-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-red-500/30">0 Unit</span>
        </div>

        <div id="vehicleListContainer" class="space-y-2.5 overflow-y-auto max-h-[500px] pr-1">
          <div class="text-center text-xs text-slate-500 py-8">Memuat data unit...</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hqyrnilihllhpxdnwvsg.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxeXJuaWxpaGxsaHB4ZG53dnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNTYzNTcsImV4cCI6MjExMDczMjM1N30.iTl94p4PUBPZ1PaACwkMIKExT8lGy0ERY54ua9foPCc';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    if (localStorage.getItem('isLoggedIn') !== 'true') {
      const pwd = prompt('Masukkan Password Admin (Citra123):');
      if (pwd === 'Citra123') {
        localStorage.setItem('isLoggedIn', 'true');
      } else {
        alert('Password salah!');
        window.location.href = 'index.html';
      }
    }

    function handleLogout() {
      localStorage.removeItem('isLoggedIn');
      window.location.href = 'index.html';
    }

    async function fetchVehicles() {
      const { data, error } = await db.from('pkb_service').select('*').order('created_at', { ascending: true });
      const container = document.getElementById('vehicleListContainer');
      const badge = document.getElementById('totalUnitBadge');

      if (error) {
        container.innerHTML = `<div class="text-red-400 text-xs text-center py-4">Gagal memuat data.</div>`;
        return;
      }

      badge.textContent = `${data.length} Unit`;

      if (data.length === 0) {
        container.innerHTML = `<div class="text-slate-500 text-xs text-center py-8">Belum ada unit dalam antrean.</div>`;
        return;
      }

      container.innerHTML = data.map(v => {
        return `
          <div class="bg-[#080c17] border border-slate-800 p-3 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
              <div class="flex items-center gap-2">
                <span class="bg-white text-slate-950 font-black text-xs px-2 py-0.5 rounded font-mono">${v.no_polisi}</span>
                <span class="text-white font-bold text-xs">${v.tipe_mobil}</span>
              </div>
              <div class="text-[11px] text-slate-400 mt-1">Mekanik: <b class="text-slate-200">${v.mekanik || '-'}</b> (${v.stall || '-'})</div>
              <div class="text-[10px] text-red-400 font-semibold mt-0.5">Status: ${v.status_pkb}</div>
            </div>
            <div class="flex flex-wrap items-center gap-1.5 w-full sm:w-auto justify-end border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-800">
              <select onchange="updateStatus('${v.id}', this.value)" class="bg-[#111726] border border-slate-700 text-slate-200 text-[11px] rounded-lg px-2 py-1">
                <option value="Walk In Proses" ${v.status_pkb === 'Walk In Proses' ? 'selected' : ''}>1. Walk In</option>
                <option value="Confirm" ${v.status_pkb === 'Confirm' ? 'selected' : ''}>2. Confirm (QC)</option>
                <option value="Final Billed" ${v.status_pkb === 'Final Billed' ? 'selected' : ''}>3. Final Billed</option>
                <option value="Sudah Bayar" ${v.status_pkb === 'Sudah Bayar' ? 'selected' : ''}>4. Sudah Bayar</option>
              </select>
              <button onclick="toggleCuci('${v.id}', ${!v.cuci_selesai})" class="px-2.5 py-1 rounded-lg text-[11px] font-bold ${v.cuci_selesai ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30'}">
                ${v.cuci_selesai ? '✓ Cuci Selesai' : '🚿 Cuci'}
              </button>
              <button onclick="deleteVehicle('${v.id}')" class="bg-red-500/15 hover:bg-red-500/25 text-red-400 p-1.5 rounded-lg text-xs" title="Hapus">
                🗑️
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function addVehicle(e) {
      e.preventDefault();
      const no_polisi = document.getElementById('no_polisi').value.toUpperCase();
      const tipe_mobil = document.getElementById('tipe_mobil').value;
      const mekanik = document.getElementById('mekanik').value;
      const stall = document.getElementById('stall').value;

      const { error } = await db.from('pkb_service').insert([{
        no_polisi, tipe_mobil, mekanik, stall, status_pkb: 'Walk In Proses', cuci_selesai: false
      }]);

      if (!error) {
        document.getElementById('addForm').reset();
        fetchVehicles();
      } else {
        alert('Gagal menambah unit: ' + error.message);
      }
    }

    async function updateStatus(id, status_pkb) {
      await db.from('pkb_service').update({ status_pkb }).eq('id', id);
      fetchVehicles();
    }

    async function toggleCuci(id, cuci_selesai) {
      await db.from('pkb_service').update({ cuci_selesai }).eq('id', id);
      fetchVehicles();
    }

    async function deleteVehicle(id) {
      if (confirm('Yakin ingin menghapus unit ini dari antrean?')) {
        await db.from('pkb_service').delete().eq('id', id);
        fetchVehicles();
      }
    }

    fetchVehicles();
    db.channel('admin-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'pkb_service' }, fetchVehicles).subscribe();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Unit - ASTRA DAIHATSU CITRA RAYA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#080c17] text-slate-100 p-4 md:p-8 font-sans min-h-screen">
  <div class="max-w-5xl mx-auto">
    <!-- Header Gelap dengan Aksen Merah & Logo -->
    <div class="bg-[#0b101d] border border-slate-800 p-6 rounded-2xl shadow-xl mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-5">
        <div class="bg-white px-4 py-2.5 rounded-xl shadow flex items-center gap-3 shrink-0">
          <img src="./public/logo-astra.png" alt="Astra Daihatsu" class="h-10 w-auto object-contain"
               onerror="this.style.display='none'; document.getElementById('fallbackLogoAdmin').classList.remove('hidden');">
          <img src="./public/ir-digital.png" alt="IR Digital" class="h-8 w-auto object-contain border-l border-slate-200 pl-3"
               onerror="this.style.display='none';">
          <div id="fallbackLogoAdmin" class="hidden bg-red-600 p-2 rounded-lg flex items-center justify-center">
            <svg viewBox="0 0 64 44" class="h-6 w-auto">
              <ellipse cx="32" cy="22" rx="28" ry="18" fill="none" stroke="#ffffff" stroke-width="4"/>
              <path d="M14 22 L32 10 L50 22 L32 34 Z" fill="#ffffff"/>
            </svg>
          </div>
        </div>
        <div class="flex flex-col justify-center">
          <h1 class="text-xl md:text-2xl font-black tracking-wide text-white leading-tight">
            ASTRA DAIHATSU <span class="text-red-500">CITRA RAYA</span>
          </h1>
          <p class="text-slate-400 text-sm mt-0.5">Panel Kontrol Proses Service, QC & Cuci Kendaraan</p>
        </div>
      </div>
      <a href="index.html" target="_blank" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-red-600/20 shrink-0 transition">
        Buka Layar Monitor TV ↗
      </a>
    </div>

    <!-- Form Input Unit Baru -->
    <div class="bg-[#111726] border border-slate-800 p-6 rounded-2xl shadow-lg mb-6">
      <h2 class="font-bold text-base text-white mb-4 flex items-center gap-2">
        <span class="text-red-500">+</span> Tambah Unit Baru
      </h2>
      <form id="formPkb" class="grid grid-cols-1 md:grid-cols-5 gap-3">
        <input type="text" id="no_polisi" placeholder="No. Polisi (B 1234 XY)" required
               class="bg-[#080c17] border border-slate-700 text-white placeholder-slate-500 p-2.5 rounded-xl uppercase font-bold focus:outline-none focus:border-red-500">

        <select id="tipe_mobil" required
                class="bg-[#080c17] border border-slate-700 text-white p-2.5 rounded-xl font-semibold focus:outline-none focus:border-red-500">
          <option value="" disabled selected>-- Pilih Tipe Mobil --</option>
          <option value="XENIA">XENIA</option>
          <option value="GRANDMAX MINIBUS">GRANDMAX MINIBUS</option>
          <option value="GRANDMAX PICK UP">GRANDMAX PICK UP</option>
          <option value="SIGRA">SIGRA</option>
          <option value="TERIOS">TERIOS</option>
          <option value="LUXIO">LUXIO</option>
          <option value="SIRION">SIRION</option>
        </select>

        <input type="text" id="mekanik" placeholder="Nama Mekanik" required
               class="bg-[#080c17] border border-slate-700 text-white placeholder-slate-500 p-2.5 rounded-xl focus:outline-none focus:border-red-500">

        <select id="stall" required
                class="bg-[#080c17] border border-slate-700 text-white p-2.5 rounded-xl font-semibold focus:outline-none focus:border-red-500">
          <option value="" disabled selected>-- Pilih Stall --</option>
          <option value="Stall 1">Stall 1</option>
          <option value="Stall 2">Stall 2</option>
          <option value="Stall 3">Stall 3</option>
          <option value="Stall 4">Stall 4</option>
          <option value="Stall 5">Stall 5</option>
          <option value="Stall 6">Stall 6</option>
        </select>

        <button type="submit" id="btnSubmit" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 px-4 rounded-xl shadow-lg shadow-red-600/20 transition">
          Masuk Proses
        </button>
      </form>
    </div>

    <!-- Daftar Unit Dalam Proses -->
    <div class="bg-[#111726] border border-slate-800 p-6 rounded-2xl shadow-lg">
      <h2 class="font-bold text-base text-white mb-4">Daftar Kendaraan Dalam Proses</h2>
      <div id="listAdmin" class="space-y-3">Menghubungkan ke database...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hqyrnilihllhpxdnwvsg.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxeXJuaWxpaGxsaHB4ZG53dnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxNTYzNTcsImV4cCI6MjExMDczMjM1N30.iTl94p4PUBPZ1PaACwkMIKExT8lGy0ERY54ua9foPCc';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadAdminData() {
      const { data, error } = await db.from('pkb_service').select('*').order('created_at', { ascending: true });
      const container = document.getElementById('listAdmin');
      if (error) {
        return container.innerHTML = `<div class="bg-red-950/50 border border-red-500/40 text-red-300 p-4 rounded-xl text-sm">
          <b>Gagal memuat data:</b> ${error.message}
        </div>`;
      }
      if (data.length === 0) return container.innerHTML = `<p class="text-slate-500 text-center py-6">Belum ada unit dalam proses servis.</p>`;

      container.innerHTML = data.map(item => `
        <div class="border border-slate-800 rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-[#080c17]">
          <div>
            <div class="flex items-center gap-2.5">
              <span class="bg-white text-slate-950 font-black px-2.5 py-0.5 rounded-lg text-base">${item.no_polisi}</span>
              <span class="bg-red-500/15 text-red-400 border border-red-500/30 text-xs px-2.5 py-0.5 rounded-full font-bold">${item.tipe_mobil}</span>
            </div>
            <p class="text-sm text-slate-400 mt-1.5">Mekanik: <b class="text-slate-200">${item.mekanik}</b> • <span class="text-amber-400 font-semibold">${item.stall}</span></p>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <select onchange="updateStatus('${item.id}', this.value)" class="bg-[#161e2e] border border-slate-700 text-white p-2 rounded-xl text-sm font-semibold focus:outline-none">
              <option value="Walk In Proses" ${item.status_pkb === 'Walk In Proses' ? 'selected' : ''}>1. Walk In Proses (Mekanik)</option>
              <option value="Confirm" ${item.status_pkb === 'Confirm' ? 'selected' : ''}>2. Confirm (QC Kepala Regu)</option>
              <option value="Final Billed" ${item.status_pkb === 'Final Billed' ? 'selected' : ''}>3. Final Billed (Siap Kasir)</option>
            </select>

            <button onclick="toggleCuci('${item.id}',${!item.cuci_selesai})" 
              class="px-3.5 py-2 rounded-xl text-sm font-bold border transition ${item.cuci_selesai ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30' : 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30'}">
              ${item.cuci_selesai ? '✓ Cuci Selesai' : '🚿 Cuci Belum Selesai'}
            </button>

            <button onclick="hapusUnit('${item.id}')" class="bg-rose-500/15 text-rose-400 border border-rose-500/30 px-3.5 py-2 rounded-xl text-sm font-bold hover:bg-rose-500/25 transition">
              Selesai / Hapus
            </button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('formPkb').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      const { error } = await db.from('pkb_service').insert([{
        no_pkb: '-',
        no_polisi: document.getElementById('no_polisi').value.toUpperCase(),
        tipe_mobil: document.getElementById('tipe_mobil').value,
        mekanik: document.getElementById('mekanik').value,
        stall: document.getElementById('stall').value,
        status_pkb: 'Walk In Proses',
        cuci_selesai: false
      }]);

      btn.disabled = false;
      btn.textContent = 'Masuk Proses';

      if (error) {
        alert('Gagal menyimpan data: ' + error.message);
      } else {
        e.target.reset();
        loadAdminData();
      }
    });

    async function updateStatus(id, status_pkb) {
      await db.from('pkb_service').update({ status_pkb }).eq('id', id);
      loadAdminData();
    }

    async function toggleCuci(id, cuci_selesai) {
      await db.from('pkb_service').update({ cuci_selesai }).eq('id', id);
      loadAdminData();
    }

    async function hapusUnit(id) {
      if (confirm('Hapus unit ini dari layar monitor (sudah dibayar)?')) {
        await db.from('pkb_service').delete().eq('id', id);
        loadAdminData();
      }
    }

    db.channel('admin-063')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'pkb_service' }, loadAdminData)
      .subscribe();

    loadAdminData();
  </script>
</body>
</html>
